name: Rabat internship morning brief

on:
  schedule:
    # The script sends only during the 08:00 hour in Casablanca. Running hourly
    # handles Morocco timezone changes while keeping manual test runs immediate.
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Send Rabat internship brief
        env:
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          BRIEF_RECIPIENT: ${{ secrets.BRIEF_RECIPIENT }}
        run: python scripts/send_rabat_stage_brief.py ${{ github.event_name == 'schedule' && '--scheduled' || '' }}
